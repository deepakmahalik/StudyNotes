<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>NodeTree - Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0B1120;
      --bg2: #1e293b;
      --accent: #38bdf8;
      --text: #f8fafc;
      --text2: #94a3b8;
      --border: rgba(56,189,248,0.2);
    }
    body {
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }
    /* Background elements for glassmorphism */
    .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      z-index: 0;
      opacity: 0.5;
    }
    
    @keyframes float1 {
      0% { transform: translate(0, 0) scale(1); }
      33% { transform: translate(30px, -50px) scale(1.1); }
      66% { transform: translate(-20px, 20px) scale(0.9); }
      100% { transform: translate(0, 0) scale(1); }
    }
    @keyframes float2 {
      0% { transform: translate(0, 0) scale(1); }
      33% { transform: translate(-30px, 50px) scale(1.2); }
      66% { transform: translate(20px, -20px) scale(0.8); }
      100% { transform: translate(0, 0) scale(1); }
    }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .blob-1 { 
      top: -10%; left: -10%; width: 500px; height: 500px; background: #38bdf8;
      animation: float1 15s ease-in-out infinite; 
    }
    .blob-2 { 
      bottom: -10%; right: -10%; width: 400px; height: 400px; background: #a78bfa; 
      animation: float2 18s ease-in-out infinite reverse;
    }
    
    .login-container {
      position: relative;
      z-index: 10;
      background: rgba(30, 41, 59, 0.6);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      padding: 40px;
      border-radius: 20px;
      width: 340px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    
    #bg-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1; /* Above blobs, below login container */
      pointer-events: none;
      opacity: 0.4;
    }
    
    .logo {
      text-align: center;
      font-size: 28px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    .logo-icon {
      width: 64px;
      height: 64px;
      object-fit: contain;
    }
    .input-group {
      margin-bottom: 20px;
    }
    .input-group label {
      display: block;
      font-size: 13px;
      color: var(--text2);
      margin-bottom: 8px;
    }
    .input-group input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px 16px;
      background: rgba(0, 0, 0, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      color: var(--text);
      font-family: inherit;
      font-size: 14px;
      transition: all 0.2s;
    }
    .input-group input:focus {
      outline: none;
      border-color: var(--accent);
      background: rgba(0, 0, 0, 0.4);
    }
    .btn-submit {
      width: 100%;
      padding: 12px;
      background: rgba(56, 189, 248, 0.15);
      border: 1px solid var(--accent);
      color: var(--accent);
      border-radius: 8px;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.2s;
      margin-top: 10px;
    }
    .btn-submit:hover {
      background: rgba(56, 189, 248, 0.3);
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
    }
    .error-msg {
      color: #f87171;
      font-size: 13px;
      text-align: center;
      margin-bottom: 15px;
      min-height: 20px;
    }
    .toggle-link {
      display: block;
      text-align: center;
      margin-top: 15px;
      font-size: 12px;
      color: var(--text2);
      cursor: pointer;
      text-decoration: underline;
    }
    .toggle-link:hover { color: var(--text); }
    .signup-field { display: none; }
  </style>
</head>
<body>
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <canvas id="bg-canvas"></canvas>
  
  <div class="login-container">
    <div class="logo">
      <img src="/static/logo.png" class="logo-icon" alt="Logo"> NodeTree
    </div>
    
    <div class="error-msg" id="error-msg">{{ error if error else "" }}</div>
    
    <form id="auth-form" action="/login" method="POST">
      <div class="input-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" required autocomplete="off" autofocus>
      </div>
      <div class="input-group signup-field">
        <label for="first_name">First Name</label>
        <input type="text" id="first_name" name="first_name" class="signup-input">
      </div>
      <div class="input-group signup-field">
        <label for="last_name">Last Name</label>
        <input type="text" id="last_name" name="last_name" class="signup-input">
      </div>
      <div class="input-group signup-field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" class="signup-input">
      </div>
      <div class="input-group signup-field">
        <label for="location">Location</label>
        <input type="text" id="location" name="location" class="signup-input">
      </div>
      <div class="input-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required>
      </div>
      <button type="submit" class="btn-submit" id="btn-submit">Sign In</button>
    </form>
    <a class="toggle-link" id="toggle-link" onclick="toggleMode()">Need an account? Sign Up</a>
  </div>

  <script>
    let mode = '{{ mode if mode else "login" }}';
    
    function setMode(m) {
      mode = m;
      const form = document.getElementById('auth-form');
      const signupFields = document.querySelectorAll('.signup-field');
      const signupInputs = document.querySelectorAll('.signup-input');
      const btn = document.getElementById('btn-submit');
      const toggle = document.getElementById('toggle-link');
      
      if (mode === 'signup') {
        form.action = '/signup';
        signupFields.forEach(f => f.style.display = 'block');
        signupInputs.forEach(i => i.required = true);
        btn.textContent = 'Sign Up';
        toggle.textContent = 'Already have an account? Sign In';
      } else {
        form.action = '/login';
        signupFields.forEach(f => f.style.display = 'none');
        signupInputs.forEach(i => i.required = false);
        btn.textContent = 'Sign In';
        toggle.textContent = 'Need an account? Sign Up';
      }
    }
    
    function toggleMode() {
      setMode(mode === 'login' ? 'signup' : 'login');
    }
    
    // Initialize
    if (mode === 'signup') setMode('signup');
  </script>

  <script>
    const canvas = document.getElementById('bg-canvas');
    const ctx = canvas.getContext('2d');
    
    let width, height;
    let particles = [];
    const connectionDistance = 150;

    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
      initParticles();
    }

    class Particle {
      constructor() {
        this.x = Math.random() * width;
        this.y = Math.random() * height;
        this.vx = (Math.random() - 0.5) * 0.5;
        this.vy = (Math.random() - 0.5) * 0.5;
        this.radius = Math.random() * 2 + 1;
      }
      update() {
        this.x += this.vx;
        this.y += this.vy;
        if (this.x < 0 || this.x > width) this.vx *= -1;
        if (this.y < 0 || this.y > height) this.vy *= -1;
      }
      draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = '#38bdf8';
        ctx.fill();
      }
    }

    function initParticles() {
      particles = [];
      const numParticles = Math.floor((width * height) / 15000);
      for (let i = 0; i < numParticles; i++) {
        particles.push(new Particle());
      }
    }

    function animate() {
      ctx.clearRect(0, 0, width, height);
      
      for (let i = 0; i < particles.length; i++) {
        particles[i].update();
        particles[i].draw();
        
        // Draw branching lines
        for (let j = i + 1; j < particles.length; j++) {
          const dx = particles[i].x - particles[j].x;
          const dy = particles[i].y - particles[j].y;
          const dist = Math.sqrt(dx * dx + dy * dy);
          
          if (dist < connectionDistance) {
            ctx.beginPath();
            ctx.moveTo(particles[i].x, particles[i].y);
            ctx.lineTo(particles[j].x, particles[j].y);
            // Opacity based on distance
            const opacity = 1 - (dist / connectionDistance);
            ctx.strokeStyle = `rgba(56, 189, 248, ${opacity * 0.5})`;
            ctx.lineWidth = 1;
            ctx.stroke();
          }
        }
      }
      requestAnimationFrame(animate);
    }

    window.addEventListener('resize', resize);
    resize();
    animate();
  </script>
</body>
</html>
