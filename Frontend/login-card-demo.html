<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login Card — Glassmorphism</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --glass-bg:     rgba(255,255,255,0.08);
  --glass-border: rgba(255,255,255,0.18);
  --glass-blur:   blur(24px);
  --accent:       #a78bfa;
  --accent2:      #60a5fa;
  --danger:       #f87171;
  --text:         #f1f5f9;
  --text2:        #cbd5e1;
  --text3:        #94a3b8;
  --sans:         'Inter', sans-serif;
}

body {
  font-family: var(--sans);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(135deg, #0d0b1e 0%, #13104a 40%, #0a1a30 100%);
  overflow: hidden;
}

/* Ambient orbs */
body::before, body::after {
  content: '';
  position: fixed;
  border-radius: 50%;
  filter: blur(80px);
  opacity: 0.35;
  pointer-events: none;
}
body::before {
  width: 500px; height: 500px;
  background: radial-gradient(circle, #7c3aed, transparent);
  top: -100px; left: -100px;
  animation: drift1 8s ease-in-out infinite alternate;
}
body::after {
  width: 400px; height: 400px;
  background: radial-gradient(circle, #1d4ed8, transparent);
  bottom: -80px; right: -80px;
  animation: drift2 10s ease-in-out infinite alternate;
}

@keyframes drift1 { to { transform: translate(60px, 40px); } }
@keyframes drift2 { to { transform: translate(-40px, -60px); } }

/* Card */
.card {
  width: 380px;
  padding: 40px 36px;
  background: var(--glass-bg);
  backdrop-filter: var(--glass-blur);
  -webkit-backdrop-filter: var(--glass-blur);
  border: 1px solid var(--glass-border);
  border-radius: 24px;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.12),
    0 24px 64px rgba(0,0,0,0.4);
  animation: fadeInUp 0.6s cubic-bezier(0.16,1,0.3,1) both;
  position: relative;
  z-index: 1;
}

@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(32px) scale(0.97); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}

/* Logo */
.logo {
  width: 48px; height: 48px;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  border-radius: 14px;
  margin: 0 auto 20px;
  display: flex; align-items: center; justify-content: center;
  font-size: 22px;
  box-shadow: 0 8px 24px rgba(167,139,250,0.4);
  animation: fadeInUp 0.6s cubic-bezier(0.16,1,0.3,1) 0.05s both;
}

.title {
  color: var(--text);
  font-size: 22px;
  font-weight: 700;
  text-align: center;
  letter-spacing: -0.3px;
  animation: fadeInUp 0.6s cubic-bezier(0.16,1,0.3,1) 0.1s both;
}
.subtitle {
  color: var(--text3);
  font-size: 13px;
  text-align: center;
  margin-top: 6px;
  margin-bottom: 28px;
  animation: fadeInUp 0.6s cubic-bezier(0.16,1,0.3,1) 0.15s both;
}

/* Form */
.field {
  margin-bottom: 16px;
  animation: fadeInUp 0.6s cubic-bezier(0.16,1,0.3,1) both;
}
.field:nth-child(1) { animation-delay: 0.2s; }
.field:nth-child(2) { animation-delay: 0.25s; }

label {
  display: block;
  color: var(--text2);
  font-size: 12px;
  font-weight: 500;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  margin-bottom: 7px;
}

.input-wrap {
  position: relative;
}
.input-wrap .icon {
  position: absolute;
  left: 14px; top: 50%; transform: translateY(-50%);
  color: var(--text3);
  font-size: 15px;
  pointer-events: none;
  transition: color 0.2s ease;
}

input[type="email"],
input[type="password"] {
  width: 100%;
  padding: 11px 14px 11px 40px;
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 12px;
  color: var(--text);
  font-size: 14px;
  font-family: var(--sans);
  outline: none;
  transition: border-color 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
}
input::placeholder { color: var(--text3); }
input:focus {
  border-color: var(--accent);
  background: rgba(167,139,250,0.08);
  box-shadow: 0 0 0 3px rgba(167,139,250,0.2);
}
input:focus + .icon, .input-wrap:focus-within .icon { color: var(--accent); }

/* Password toggle */
.toggle-pw {
  position: absolute;
  right: 12px; top: 50%; transform: translateY(-50%);
  background: none; border: none;
  color: var(--text3); font-size: 15px; cursor: pointer;
  padding: 4px;
  transition: color 0.2s ease;
}
.toggle-pw:hover { color: var(--accent); }

/* Forgot */
.forgot-row {
  text-align: right;
  margin-top: -8px;
  margin-bottom: 24px;
  animation: fadeInUp 0.6s cubic-bezier(0.16,1,0.3,1) 0.3s both;
}
.forgot {
  color: var(--accent);
  font-size: 12px;
  text-decoration: none;
  opacity: 0.85;
  transition: opacity 0.2s ease;
}
.forgot:hover { opacity: 1; text-decoration: underline; }

/* Button */
.btn {
  width: 100%;
  padding: 13px;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  border: none;
  border-radius: 12px;
  color: #fff;
  font-size: 14px;
  font-weight: 600;
  font-family: var(--sans);
  cursor: pointer;
  letter-spacing: 0.02em;
  position: relative;
  overflow: hidden;
  transition: transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;
  box-shadow: 0 6px 20px rgba(167,139,250,0.35);
  animation: fadeInUp 0.6s cubic-bezier(0.16,1,0.3,1) 0.35s both;
}
.btn:hover {
  transform: translateY(-2px);
  filter: brightness(1.1);
  box-shadow: 0 10px 28px rgba(167,139,250,0.5);
}
.btn:active { transform: translateY(0); filter: brightness(0.95); }

/* Ripple */
.btn .ripple {
  position: absolute;
  border-radius: 50%;
  background: rgba(255,255,255,0.3);
  transform: scale(0);
  animation: ripple 0.5s linear;
  pointer-events: none;
}
@keyframes ripple {
  to { transform: scale(4); opacity: 0; }
}

/* Divider */
.divider {
  display: flex; align-items: center; gap: 12px;
  margin: 22px 0;
  color: var(--text3);
  font-size: 11px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  animation: fadeInUp 0.6s cubic-bezier(0.16,1,0.3,1) 0.4s both;
}
.divider::before, .divider::after {
  content: ''; flex: 1;
  height: 1px;
  background: rgba(255,255,255,0.1);
}

/* Social */
.socials {
  display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
  animation: fadeInUp 0.6s cubic-bezier(0.16,1,0.3,1) 0.45s both;
}
.social-btn {
  padding: 10px;
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 10px;
  color: var(--text2);
  font-size: 13px;
  font-family: var(--sans);
  font-weight: 500;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center; gap: 8px;
  transition: background 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
}
.social-btn:hover {
  background: rgba(255,255,255,0.1);
  border-color: rgba(255,255,255,0.2);
  transform: translateY(-1px);
}

/* Sign up */
.signup {
  text-align: center;
  margin-top: 20px;
  color: var(--text3);
  font-size: 13px;
  animation: fadeInUp 0.6s cubic-bezier(0.16,1,0.3,1) 0.5s both;
}
.signup a {
  color: var(--accent);
  text-decoration: none;
  font-weight: 500;
  transition: opacity 0.2s;
}
.signup a:hover { opacity: 0.8; text-decoration: underline; }

:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 6px; }
</style>
</head>
<body>

<div class="card">
  <div class="logo">✦</div>
  <div class="title">Welcome back</div>
  <div class="subtitle">Sign in to your account</div>

  <form onsubmit="return false">
    <div class="field">
      <label>Email</label>
      <div class="input-wrap">
        <input type="email" placeholder="you@example.com" autocomplete="email">
        <span class="icon">✉</span>
      </div>
    </div>

    <div class="field">
      <label>Password</label>
      <div class="input-wrap">
        <input type="password" id="pw" placeholder="••••••••" autocomplete="current-password">
        <span class="icon">🔒</span>
        <button type="button" class="toggle-pw" onclick="togglePw()" title="Show/hide password">👁</button>
      </div>
    </div>

    <div class="forgot-row">
      <a href="#" class="forgot">Forgot password?</a>
    </div>

    <button class="btn" onclick="rippleEffect(event, this)">Sign In</button>
  </form>

  <div class="divider">or continue with</div>

  <div class="socials">
    <button class="social-btn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
      Google
    </button>
    <button class="social-btn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="var(--text2)"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/></svg>
      GitHub
    </button>
  </div>

  <div class="signup">Don't have an account? <a href="#">Sign up</a></div>
</div>

<script>
function togglePw() {
  const pw = document.getElementById('pw');
  pw.type = pw.type === 'password' ? 'text' : 'password';
}

function rippleEffect(e, btn) {
  const rect = btn.getBoundingClientRect();
  const size = Math.max(rect.width, rect.height);
  const x = e.clientX - rect.left - size / 2;
  const y = e.clientY - rect.top - size / 2;
  const ripple = document.createElement('span');
  ripple.className = 'ripple';
  ripple.style.cssText = `width:${size}px;height:${size}px;left:${x}px;top:${y}px`;
  btn.appendChild(ripple);
  ripple.addEventListener('animationend', () => ripple.remove());
}
</script>
</body>
</html>
