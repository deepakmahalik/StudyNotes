<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>NodeTree - Admin Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0B1120;
      --bg2: #1e293b;
      --accent: #38bdf8;
      --danger: #f87171;
      --text: #f8fafc;
      --text2: #94a3b8;
      --border: rgba(56,189,248,0.2);
    }
    body {
      margin: 0; padding: 0; font-family: 'Inter', sans-serif;
      background: var(--bg); color: var(--text);
    }
    .header {
      background: var(--bg2); border-bottom: 1px solid var(--border);
      padding: 15px 30px; display: flex; align-items: center; justify-content: space-between;
    }
    .logo { font-size: 20px; font-weight: 600; color: var(--text); display: flex; align-items: center; gap: 8px; }
    .logo-icon { width: 44px; height: 44px; object-fit: contain; }
    .btn {
      background: transparent; border: 1px solid var(--border); border-radius: 5px;
      color: var(--text); padding: 6px 12px; font-size: 13px; font-weight: 500;
      cursor: pointer; transition: all 0.15s; text-decoration: none; display: inline-block;
    }
    .btn:hover { background: rgba(56,189,248,0.1); border-color: var(--accent); color: var(--accent); }
    .container { padding: 30px; max-width: 900px; margin: 0 auto; }
    h1 { font-weight: 500; font-size: 24px; margin-top: 0; margin-bottom: 24px; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
    
    table { width: 100%; border-collapse: collapse; background: var(--bg2); border-radius: 8px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
    th, td { padding: 12px 16px; text-align: left; border-bottom: 1px solid rgba(255,255,255,0.05); }
    th { background: rgba(0,0,0,0.2); font-weight: 500; color: var(--text2); font-size: 13px; text-transform: uppercase; letter-spacing: 0.05em; }
    tr:hover { background: rgba(255,255,255,0.02); }
    td { font-size: 14px; }
    .role-badge {
      display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 500;
    }
    .role-admin { background: rgba(56,189,248,0.15); color: var(--accent); }
    .role-user { background: rgba(148,163,184,0.15); color: var(--text2); }
    
    .actions { display: flex; gap: 8px; }
    .input-edit {
      background: rgba(0,0,0,0.2); border: 1px solid var(--border); border-radius: 4px;
      color: var(--text); padding: 4px 8px; font-size: 13px; font-family: inherit; width: 150px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo"><img src="/static/logo.png" class="logo-icon" alt="Logo"> NodeTree Admin</div>
    <div style="display:flex; gap:10px">
      <a href="/app" class="btn">Go to App</a>
      <a href="/rag" class="btn" style="border-color: rgba(167,139,250,0.4); color: #a78bfa;">⚡ RAG Pipeline</a>
      <a href="/logout" class="btn">Logout</a>
    </div>
  </div>
  
  <div class="container">
    <h1>User Management</h1>
    
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Username</th>
          <th>Role</th>
          <th>First Name</th>
          <th>Last Name</th>
          <th>Location</th>
          <th>Email</th>
          <th>Password (Reset)</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        {% for user in users %}
        <tr>
          <form action="/admin/update_user/{{ user.id }}" method="POST">
            <td>{{ user.id }}</td>
            <td>
              <input type="text" name="username" class="input-edit" value="{{ user.username }}" required>
            </td>
            <td>
              <span class="role-badge {{ 'role-admin' if user.is_admin else 'role-user' }}">
                {{ "Admin" if user.is_admin else "User" }}
              </span>
            </td>
            <td>
              <input type="text" name="first_name" class="input-edit" value="{{ user.first_name }}">
            </td>
            <td>
              <input type="text" name="last_name" class="input-edit" value="{{ user.last_name }}">
            </td>
            <td>
              <input type="text" name="location" class="input-edit" value="{{ user.location }}">
            </td>
            <td>
              <input type="email" name="email" class="input-edit" value="{{ user.email }}" required>
            </td>
            <td>
              <input type="password" name="password" class="input-edit" placeholder="New Password...">
            </td>
            <td class="actions">
              <button type="submit" class="btn">Save</button>
              {% if not user.is_admin %}
                <a href="/admin/view_map/{{ user.id }}" class="btn" style="border-color: rgba(167, 139, 250, 0.4); color: #a78bfa;">View Map</a>
              {% endif %}
            </td>
          </form>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</body>
</html>
